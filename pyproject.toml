[project]
name = "anilistshare"
version = "0.1.0"
description = "A fun way to store your anime watchlist"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "brotli>=1.2.0",
    "dj-database-url>=2.3.0",
    "django>=6.0.3",
    "django-allauth[mfa,socialaccount]>=65.15.0",
    "django-cors-headers>=4.9.0",
    "django-stubs>=6.0.1",
    "django-watchfiles>=1.4.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "whitenoise>=6.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "AniListShare.settings_test"
python_files = ["test_*.py"]
testpaths = ["api/tests", "animeapi/tests"]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
    "django-silk>=5.5.0",
    "fonttools[woff]>=4.60.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]
